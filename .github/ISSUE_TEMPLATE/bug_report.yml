name: "버그 제보"
description: "동작이 잘못됐거나 오류가 나는 경우 알려 주세요."
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        제보해 주셔서 감사합니다. 같은 내용의 이슈가 이미 있는지 먼저 검색해 주세요.
        보안 취약점은 이 양식 대신 [비공개 제보](https://github.com/ai-paas/ai-paas-web/security/advisories/new)를 이용해 주세요.
  - type: dropdown
    id: area
    attributes:
      label: "문제가 발생한 메뉴"
      options:
        - "서비스"
        - "워크플로우"
        - "모델"
        - "데이터셋"
        - "지식 베이스"
        - "프롬프트"
        - "학습"
        - "대시보드"
        - "인프라 관리"
        - "멤버 관리"
        - "로그인 · 공통"
        - "기타"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: "어떤 문제가 있었나요?"
      description: "실제로 어떻게 동작했는지 적어 주세요. 오류 문구가 있으면 그대로 옮겨 주세요."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "재현 방법"
      description: "문제를 다시 만들 수 있는 순서를 적어 주세요."
      placeholder: |
        1. '인프라 관리 > VM' 메뉴로 이동
        2. '생성' 클릭
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "기대한 동작"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "버전"
      description: "릴리즈 버전(예: v0.2.0)이나 커밋 해시를 적어 주세요."
  - type: input
    id: environment
    attributes:
      label: "브라우저와 화면 크기"
      placeholder: "예: Chrome 131, 1920×1080"
  - type: textarea
    id: extra
    attributes:
      label: "스크린샷 · 로그"
      description: "화면 캡처나 브라우저 콘솔 오류가 있으면 첨부해 주세요. 토큰, IP, 계정 정보 같은 민감한 값은 가려 주세요."
