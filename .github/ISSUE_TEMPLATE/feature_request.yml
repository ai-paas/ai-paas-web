name: "기능 제안"
description: "새 기능이나 개선 아이디어를 제안해 주세요."
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: "어떤 문제를 해결하고 싶은가요?"
      description: "지금 불편한 점이나 이 기능이 필요한 상황을 적어 주세요."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: "제안하는 방법"
      description: "어떻게 바뀌면 좋을지 적어 주세요. 화면 스케치나 예시가 있으면 첨부해 주세요."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "고려한 다른 방법"
      description: "다른 해결 방법을 생각해 보셨다면 적어 주세요."
  - type: dropdown
    id: area
    attributes:
      label: "관련 메뉴"
      options:
        - "서비스"
        - "워크플로우"
        - "모델"
        - "데이터셋"
        - "지식 베이스"
        - "프롬프트"
        - "학습"
        - "대시보드"
        - "인프라 관리"
        - "멤버 관리"
        - "로그인 · 공통"
        - "기타"
