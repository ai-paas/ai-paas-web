name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # 사내 레지스트리(@innogrid) 접근을 위해 self-hosted 사용 (deploy.yml build 잡과 동일)
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.3
      - name: Setup Node.js environment
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: "pnpm"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      # 커버리지 임계값(vitest.config.ts thresholds) 미달 시 여기서 PR이 실패한다
      - name: Test
        run: pnpm test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
      - name: Build
        run: pnpm run build
