name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # 사내 레지스트리(@innogrid) 접근을 위해 self-hosted 사용 (deploy.yml build 잡과 동일)
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.3
      - name: Setup Node.js environment
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: "pnpm"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      # 커버리지 임계값(vitest.config.ts thresholds) 미달 시 여기서 PR이 실패한다
      - name: Test
        run: pnpm test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
      - name: Build
        run: pnpm run build

  # Playwright 스모크 (TEST_PLAN 4A) — API 전체 목킹(허메틱)이라 백엔드 불필요.
  # 브라우저는 러너 캐시(~/.cache/ms-playwright)에 설치돼 첫 실행 이후엔 빠르다.
  # 러너에 chromium 시스템 라이브러리가 없어 launch가 실패하면 관리자가 1회
  # `pnpm exec playwright install-deps chromium`(sudo)을 실행해야 한다.
  e2e:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.3
      - name: Setup Node.js environment
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: "pnpm"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: pnpm exec playwright install chromium
      - name: E2E smoke
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
